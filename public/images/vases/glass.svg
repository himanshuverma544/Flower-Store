<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#f0f9ff" rx="20" />
  <!-- Fluted Crystal Vase -->
  <path d="M 110 70 L 190 70 L 175 230 L 125 230 Z" fill="rgba(186, 230, 253, 0.5)" stroke="#38bdf8" stroke-width="4" />
  <!-- Glass Fluted Highlights -->
  <line x1="130" y1="80" x2="137" y2="220" stroke="#bae6fd" stroke-width="3" />
  <line x1="150" y1="80" x2="150" y2="220" stroke="#ffffff" stroke-width="4" />
  <line x1="170" y1="80" x2="163" y2="220" stroke="#bae6fd" stroke-width="3" />
  <!-- Water level -->
  <ellipse cx="150" cy="140" rx="30" ry="6" fill="#38bdf8" opacity="0.4" />
  <text x="150" y="275" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Fluted Crystal Vase</text>
</svg>
