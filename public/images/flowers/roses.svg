<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0812" />
      <stop offset="50%" stop-color="#4c1020" />
      <stop offset="100%" stop-color="#19040a" />
    </linearGradient>
    <radialGradient id="roseGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d5a3f" />
      <stop offset="100%" stop-color="#143420" />
    </linearGradient>
    <radialGradient id="petalRed1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="50%" stop-color="#c9184a" />
      <stop offset="100%" stop-color="#590d22" />
    </radialGradient>
    <radialGradient id="petalRed2" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e01e4e" />
      <stop offset="60%" stop-color="#a4133c" />
      <stop offset="100%" stop-color="#4a081a" />
    </radialGradient>
    <radialGradient id="petalRed3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff758f" />
      <stop offset="60%" stop-color="#800f2f" />
      <stop offset="100%" stop-color="#3b0614" />
    </radialGradient>
    <linearGradient id="eucLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#709775" />
      <stop offset="100%" stop-color="#415d43" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="750" fill="url(#bgGrad)" />
  <circle cx="300" cy="360" r="280" fill="url(#roseGlow)" />

  <!-- Foliage / Eucalyptus Leaves -->
  <g opacity="0.85">
    <ellipse cx="180" cy="480" rx="35" ry="50" transform="rotate(-30 180 480)" fill="url(#eucLeaf)" />
    <ellipse cx="140" cy="420" rx="30" ry="45" transform="rotate(-45 140 420)" fill="url(#eucLeaf)" />
    <ellipse cx="420" cy="480" rx="35" ry="50" transform="rotate(30 420 480)" fill="url(#eucLeaf)" />
    <ellipse cx="460" cy="420" rx="30" ry="45" transform="rotate(45 460 420)" fill="url(#eucLeaf)" />
    <ellipse cx="220" cy="240" rx="30" ry="40" transform="rotate(-60 220 240)" fill="url(#eucLeaf)" />
    <ellipse cx="380" cy="240" rx="30" ry="40" transform="rotate(60 380 240)" fill="url(#eucLeaf)" />
  </g>

  <!-- Stems -->
  <path d="M 270 420 Q 280 580 290 700" stroke="url(#stemGrad)" stroke-width="12" stroke-linecap="round" fill="none" />
  <path d="M 300 420 Q 300 580 300 700" stroke="url(#stemGrad)" stroke-width="14" stroke-linecap="round" fill="none" />
  <path d="M 330 420 Q 320 580 310 700" stroke="url(#stemGrad)" stroke-width="12" stroke-linecap="round" fill="none" />

  <!-- Left Rose -->
  <g transform="translate(190, 360)">
    <circle cx="0" cy="0" r="75" fill="url(#petalRed2)" />
    <path d="M -60 -20 Q 0 -80 60 -20 Q 75 50 0 70 Q -75 50 -60 -20 Z" fill="url(#petalRed1)" />
    <path d="M -40 -10 Q 0 -50 40 -10 Q 50 35 0 45 Q -50 35 -40 -10 Z" fill="url(#petalRed3)" />
    <circle cx="0" cy="5" r="22" fill="#38040e" />
    <path d="M -15 0 Q 0 -15 15 0 Q 0 15 -15 0 Z" fill="#ff758f" />
  </g>

  <!-- Right Rose -->
  <g transform="translate(410, 360)">
    <circle cx="0" cy="0" r="75" fill="url(#petalRed2)" />
    <path d="M -60 -20 Q 0 -80 60 -20 Q 75 50 0 70 Q -75 50 -60 -20 Z" fill="url(#petalRed1)" />
    <path d="M -40 -10 Q 0 -50 40 -10 Q 50 35 0 45 Q -50 35 -40 -10 Z" fill="url(#petalRed3)" />
    <circle cx="0" cy="5" r="22" fill="#38040e" />
    <path d="M -15 0 Q 0 -15 15 0 Q 0 15 -15 0 Z" fill="#ff758f" />
  </g>

  <!-- Top Center Rose -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="80" fill="url(#petalRed2)" />
    <path d="M -70 -20 Q 0 -90 70 -20 Q 85 55 0 75 Q -85 55 -70 -20 Z" fill="url(#petalRed1)" />
    <path d="M -50 -10 Q 0 -60 50 -10 Q 60 40 0 55 Q -60 40 -50 -10 Z" fill="url(#petalRed3)" />
    <circle cx="0" cy="5" r="25" fill="#38040e" />
    <path d="M -18 0 Q 0 -20 18 0 Q 0 20 -18 0 Z" fill="#ff758f" />
  </g>

  <!-- Center Queen Rose (Foreground) -->
  <g transform="translate(300, 390)">
    <circle cx="0" cy="0" r="95" fill="url(#petalRed2)" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.6))" />
    <path d="M -80 -25 Q 0 -105 80 -25 Q 100 65 0 90 Q -100 65 -80 -25 Z" fill="url(#petalRed1)" />
    <path d="M -55 -15 Q 0 -70 55 -15 Q 70 45 0 65 Q -70 45 -55 -15 Z" fill="url(#petalRed3)" />
    <circle cx="0" cy="8" r="30" fill="#2d020a" />
    <path d="M -22 0 Q 0 -25 22 0 Q 0 25 -22 0 Z" fill="#ff758f" />
  </g>

  <!-- Velvet Silk Ribbon Wrap -->
  <g transform="translate(300, 580)">
    <path d="M -50 -10 Q 0 0 50 -10 L 60 40 Q 0 30 -60 40 Z" fill="#b91c1c" />
    <circle cx="0" cy="15" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <path d="M -10 25 Q -30 70 -50 120" stroke="#b91c1c" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 10 25 Q 30 70 50 120" stroke="#b91c1c" stroke-width="12" stroke-linecap="round" fill="none" />
  </g>

  <!-- Text Badge -->
  <rect x="180" y="675" width="240" height="40" rx="20" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)" />
  <text x="300" y="700" fill="#fecdd3" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle">VELVET SCARLET ROSES</text>
</svg>
