<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sunCenter" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="60%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c0a02" />
    </radialGradient>
    <linearGradient id="petalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bgSun)" />
  <circle cx="300" cy="360" r="280" fill="url(#sunGlow)" />

  <!-- Foliage -->
  <path d="M 170 500 Q 110 440 180 370 Q 230 460 170 500 Z" fill="#3f6212" />
  <path d="M 430 500 Q 490 440 420 370 Q 370 460 430 500 Z" fill="#365314" />

  <!-- Stems -->
  <path d="M 280 430 Q 290 580 295 680" stroke="#4d7c0f" stroke-width="14" stroke-linecap="round" fill="none" />
  <path d="M 320 430 Q 310 580 305 680" stroke="#3f6212" stroke-width="14" stroke-linecap="round" fill="none" />

  <!-- Side Flower Left -->
  <g transform="translate(190, 310) scale(0.75)">
    <g fill="url(#petalGold)">
      <ellipse cx="0" cy="-80" rx="16" ry="45" />
      <ellipse cx="56" cy="-56" rx="16" ry="45" transform="rotate(45 56 -56)" />
      <ellipse cx="80" cy="0" rx="16" ry="45" transform="rotate(90 80 0)" />
      <ellipse cx="56" cy="56" rx="16" ry="45" transform="rotate(135 56 56)" />
      <ellipse cx="0" cy="80" rx="16" ry="45" />
      <ellipse cx="-56" cy="56" rx="16" ry="45" transform="rotate(45 -56 56)" />
      <ellipse cx="-80" cy="0" rx="16" ry="45" transform="rotate(90 -80 0)" />
      <ellipse cx="-56" cy="-56" rx="16" ry="45" transform="rotate(135 -56 -56)" />
    </g>
    <circle cx="0" cy="0" r="45" fill="url(#sunCenter)" />
  </g>

  <!-- Side Flower Right -->
  <g transform="translate(410, 310) scale(0.75)">
    <g fill="url(#petalGold)">
      <ellipse cx="0" cy="-80" rx="16" ry="45" />
      <ellipse cx="56" cy="-56" rx="16" ry="45" transform="rotate(45 56 -56)" />
      <ellipse cx="80" cy="0" rx="16" ry="45" transform="rotate(90 80 0)" />
      <ellipse cx="56" cy="56" rx="16" ry="45" transform="rotate(135 56 56)" />
      <ellipse cx="0" cy="80" rx="16" ry="45" />
      <ellipse cx="-56" cy="56" rx="16" ry="45" transform="rotate(45 -56 56)" />
      <ellipse cx="-80" cy="0" rx="16" ry="45" transform="rotate(90 -80 0)" />
      <ellipse cx="-56" cy="-56" rx="16" ry="45" transform="rotate(135 -56 -56)" />
    </g>
    <circle cx="0" cy="0" r="45" fill="url(#sunCenter)" />
  </g>

  <!-- Main Sunflower Center -->
  <g transform="translate(300, 390)" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.15))">
    <!-- 16 Sun Petals Layer 1 -->
    <g fill="url(#petalGold)">
      <ellipse cx="0" cy="-110" rx="22" ry="60" />
      <ellipse cx="42" cy="-101" rx="22" ry="60" transform="rotate(22.5 42 -101)" />
      <ellipse cx="78" cy="-78" rx="22" ry="60" transform="rotate(45 78 -78)" />
      <ellipse cx="101" cy="-42" rx="22" ry="60" transform="rotate(67.5 101 -42)" />
      <ellipse cx="110" cy="0" rx="22" ry="60" transform="rotate(90 110 0)" />
      <ellipse cx="101" cy="42" rx="22" ry="60" transform="rotate(112.5 101 42)" />
      <ellipse cx="78" cy="78" rx="22" ry="60" transform="rotate(135 78 78)" />
      <ellipse cx="42" cy="101" rx="22" ry="60" transform="rotate(157.5 42 101)" />
      <ellipse cx="0" cy="110" rx="22" ry="60" />
      <ellipse cx="-42" cy="101" rx="22" ry="60" transform="rotate(22.5 -42 101)" />
      <ellipse cx="-78" cy="78" rx="22" ry="60" transform="rotate(45 -78 78)" />
      <ellipse cx="-101" cy="42" rx="22" ry="60" transform="rotate(67.5 -101 42)" />
      <ellipse cx="-110" cy="0" rx="22" ry="60" transform="rotate(90 -110 0)" />
      <ellipse cx="-101" cy="-42" rx="22" ry="60" transform="rotate(112.5 -101 -42)" />
      <ellipse cx="-78" cy="-78" rx="22" ry="60" transform="rotate(135 -78 -78)" />
      <ellipse cx="-42" cy="-101" rx="22" ry="60" transform="rotate(157.5 -42 -101)" />
    </g>
    <!-- Seed Head Center -->
    <circle cx="0" cy="0" r="65" fill="url(#sunCenter)" />
    <!-- Seed Texture Dots -->
    <circle cx="0" cy="0" r="45" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,6" fill="none" opacity="0.6" />
    <circle cx="0" cy="0" r="25" stroke="#fbbf24" stroke-width="3" stroke-dasharray="5,5" fill="none" opacity="0.6" />
  </g>

  <!-- Jute Twine Bow -->
  <g transform="translate(300, 580)">
    <ellipse cx="0" cy="0" rx="35" ry="12" fill="#d97706" />
    <circle cx="0" cy="0" r="10" fill="#b45309" />
    <path d="M -15 10 L -35 90" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <path d="M 15 10 L 35 90" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  </g>

  <rect x="180" y="675" width="240" height="40" rx="20" fill="rgba(255,255,255,0.85)" stroke="rgba(234,179,8,0.3)" />
  <text x="300" y="700" fill="#854d0e" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle">SUNLIT TUSCANY</text>
</svg>
