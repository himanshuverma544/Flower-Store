<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGarden" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="50%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#fdf2f8" />
    </linearGradient>
    <radialGradient id="gardenRose" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="60%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </radialGradient>
    <linearGradient id="delphiniumBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bgGarden)" />
  <circle cx="300" cy="360" r="280" fill="rgba(255,255,255,0.7)" />

  <!-- Delphinium Blue Spires in Background -->
  <g transform="translate(200, 260)">
    <circle cx="0" cy="-60" r="14" fill="url(#delphiniumBlue)" />
    <circle cx="-10" cy="-30" r="16" fill="url(#delphiniumBlue)" />
    <circle cx="10" cy="-10" r="18" fill="url(#delphiniumBlue)" />
    <circle cx="-5" cy="20" r="20" fill="url(#delphiniumBlue)" />
  </g>
  <g transform="translate(400, 240)">
    <circle cx="0" cy="-60" r="14" fill="url(#delphiniumBlue)" />
    <circle cx="10" cy="-30" r="16" fill="url(#delphiniumBlue)" />
    <circle cx="-10" cy="-10" r="18" fill="url(#delphiniumBlue)" />
    <circle cx="5" cy="20" r="20" fill="url(#delphiniumBlue)" />
  </g>

  <!-- Stems -->
  <path d="M 270 420 Q 290 560 295 680" stroke="#047857" stroke-width="12" stroke-linecap="round" fill="none" />
  <path d="M 300 420 Q 300 560 300 680" stroke="#065f46" stroke-width="14" stroke-linecap="round" fill="none" />
  <path d="M 330 420 Q 310 560 305 680" stroke="#047857" stroke-width="12" stroke-linecap="round" fill="none" />

  <!-- English David Austin Roses -->
  <!-- Left Blush Rose -->
  <g transform="translate(210, 370)">
    <circle cx="0" cy="0" r="65" fill="url(#gardenRose)" />
    <circle cx="0" cy="0" r="45" fill="#fbcfe8" opacity="0.6" />
    <circle cx="0" cy="0" r="25" fill="#e11d48" opacity="0.7" />
  </g>

  <!-- Right Blush Rose -->
  <g transform="translate(390, 370)">
    <circle cx="0" cy="0" r="65" fill="url(#gardenRose)" />
    <circle cx="0" cy="0" r="45" fill="#fbcfe8" opacity="0.6" />
    <circle cx="0" cy="0" r="25" fill="#e11d48" opacity="0.7" />
  </g>

  <!-- Top Center Peach Rose -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="70" fill="url(#gardenRose)" />
    <circle cx="0" cy="0" r="50" fill="#fde68a" opacity="0.5" />
    <circle cx="0" cy="0" r="28" fill="#e11d48" opacity="0.8" />
  </g>

  <!-- Center Queen Rose (Foreground) -->
  <g transform="translate(300, 390)" filter="drop-shadow(0 10px 18px rgba(0,0,0,0.15))">
    <circle cx="0" cy="0" r="85" fill="url(#gardenRose)" />
    <path d="M -60 -20 Q 0 -80 60 -20 Q 75 40 0 60 Q -75 40 -60 -20 Z" fill="#ffe4e6" opacity="0.8" />
    <path d="M -40 -10 Q 0 -50 40 -10 Q 50 30 0 40 Q -50 30 -40 -10 Z" fill="#f43f5e" opacity="0.9" />
    <circle cx="0" cy="5" r="20" fill="#881337" />
    <path d="M -10 0 Q 0 -15 10 0 Q 0 15 -10 0 Z" fill="#fecdd3" />
  </g>

  <!-- Sage Green Ribbon -->
  <g transform="translate(300, 580)">
    <rect x="-40" y="0" width="80" height="24" rx="4" fill="#059669" />
    <path d="M -15 24 L -40 100" stroke="#059669" stroke-width="10" stroke-linecap="round" />
    <path d="M 15 24 L 40 100" stroke="#059669" stroke-width="10" stroke-linecap="round" />
  </g>

  <rect x="180" y="675" width="240" height="40" rx="20" fill="rgba(255,255,255,0.85)" stroke="rgba(5,150,105,0.3)" />
  <text x="300" y="700" fill="#047857" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle">ENGLISH GARDEN</text>
</svg>
